name: Update coding stats

on:
  schedule:
    - cron: "23 2 * * *"   # daily, 08:23 Dhaka time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Codeforces and LeetCode stats
        run: python3 update_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "Update coding stats" && git push)
